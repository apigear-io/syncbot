name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build all platforms
        run: |
          mkdir -p dist

          # Linux
          GOOS=linux GOARCH=amd64 go build -o dist/syncbot-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/syncbot-linux-arm64 .

          # macOS
          GOOS=darwin GOARCH=amd64 go build -o dist/syncbot-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/syncbot-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -o dist/syncbot-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -o dist/syncbot-windows-arm64.exe .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
