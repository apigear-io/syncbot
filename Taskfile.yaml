version: '3'

vars:
  APP_NAME: syncbot
  BUILD_DIR: dist
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
  BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: -ldflags "-X syncbot/cmd.Version={{.VERSION}} -X syncbot/cmd.Commit={{.COMMIT}} -X syncbot/cmd.BuildDate={{.BUILD_DATE}}"

tasks:
  default:
    cmds:
      - task --list-all

  # Development
  dev:
    desc: Run the development server
    cmds:
      - go run . config-dev.yaml

  run:
    desc: Run with production config
    cmds:
      - go run . config.yaml

  # Building
  build:
    desc: Build for current platform
    cmds:
      - go build {{.LDFLAGS}} -o {{.APP_NAME}} .

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f {{.APP_NAME}}

  # Cross-compilation
  build:all:
    desc: Build for all platforms
    deps: [clean]
    cmds:
      - task: build:linux-amd64
      - task: build:linux-arm64
      - task: build:darwin-amd64
      - task: build:darwin-arm64
      - task: build:windows-amd64
      - task: build:windows-arm64

  build:linux-amd64:
    desc: Build for Linux AMD64
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=linux GOARCH=amd64 go build {{.LDFLAGS}} -o {{.BUILD_DIR}}/{{.APP_NAME}}-linux-amd64 .

  build:linux-arm64:
    desc: Build for Linux ARM64
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=linux GOARCH=arm64 go build {{.LDFLAGS}} -o {{.BUILD_DIR}}/{{.APP_NAME}}-linux-arm64 .

  build:darwin-amd64:
    desc: Build for macOS AMD64 (Intel)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=darwin GOARCH=amd64 go build {{.LDFLAGS}} -o {{.BUILD_DIR}}/{{.APP_NAME}}-darwin-amd64 .

  build:darwin-arm64:
    desc: Build for macOS ARM64 (Apple Silicon)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=darwin GOARCH=arm64 go build {{.LDFLAGS}} -o {{.BUILD_DIR}}/{{.APP_NAME}}-darwin-arm64 .

  build:windows-amd64:
    desc: Build for Windows AMD64
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=windows GOARCH=amd64 go build {{.LDFLAGS}} -o {{.BUILD_DIR}}/{{.APP_NAME}}-windows-amd64.exe .

  build:windows-arm64:
    desc: Build for Windows ARM64
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=windows GOARCH=arm64 go build {{.LDFLAGS}} -o {{.BUILD_DIR}}/{{.APP_NAME}}-windows-arm64.exe .

  # Convenience aliases for target device
  build:target:
    desc: Build for target device (Linux AMD64)
    cmds:
      - task: build:linux-amd64

  # Dependencies
  deps:
    desc: Download and tidy dependencies
    cmds:
      - go mod download
      - go mod tidy

  # Testing
  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  # Linting
  lint:
    desc: Run linter (requires golangci-lint)
    cmds:
      - golangci-lint run

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  # Assets
  update-assets:
    desc: Update Tabler CSS, JS, and icon fonts from CDN
    vars:
      TABLER_VERSION: 1.0.0-beta20
      ICONS_VERSION: 2.44.0
      STATIC_DIR: handlers/static
    cmds:
      - mkdir -p {{.STATIC_DIR}}/css {{.STATIC_DIR}}/js {{.STATIC_DIR}}/fonts
      - echo "Downloading Tabler CSS..."
      - curl -sL "https://cdn.jsdelivr.net/npm/@tabler/core@{{.TABLER_VERSION}}/dist/css/tabler.min.css" -o {{.STATIC_DIR}}/css/tabler.min.css
      - echo "Downloading Tabler JS..."
      - curl -sL "https://cdn.jsdelivr.net/npm/@tabler/core@{{.TABLER_VERSION}}/dist/js/tabler.min.js" -o {{.STATIC_DIR}}/js/tabler.min.js
      - echo "Downloading Tabler Icons CSS..."
      - curl -sL "https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@{{.ICONS_VERSION}}/tabler-icons.min.css" -o {{.STATIC_DIR}}/css/tabler-icons.min.css
      - echo "Downloading Tabler Icons fonts..."
      - curl -sL "https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@{{.ICONS_VERSION}}/fonts/tabler-icons.woff2" -o {{.STATIC_DIR}}/fonts/tabler-icons.woff2
      - curl -sL "https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@{{.ICONS_VERSION}}/fonts/tabler-icons.woff" -o {{.STATIC_DIR}}/fonts/tabler-icons.woff
      - curl -sL "https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@{{.ICONS_VERSION}}/fonts/tabler-icons.ttf" -o {{.STATIC_DIR}}/fonts/tabler-icons.ttf
      - echo "Fixing font paths in icons CSS..."
      - sed -i '' 's|url("./fonts/|url("../fonts/|g' {{.STATIC_DIR}}/css/tabler-icons.min.css
      - echo "Assets updated successfully!"
